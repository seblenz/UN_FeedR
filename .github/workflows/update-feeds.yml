name: Update Feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill mode: write to Supabase only, don't touch feeds/state (1 = on)"
        required: false
        default: ""
      lookback_days:
        description: "Override LOOKBACK_DAYS for this run (blank = default of 14)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: node scripts/build-feeds.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds data/state.json data/matches.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update feeds"
            git push
          fi
